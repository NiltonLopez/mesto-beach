<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Modelo de ramas de Mesto Beach System</title>
  <desc>Las ramas de trabajo salen de integration y vuelven a integration por pull request. main solo se actualiza desde integration, cuando hay una versión estable.</desc>

  <defs>
    <marker id="f-int" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f7f"/>
    </marker>
    <marker id="f-feat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c8a5c"/>
    </marker>
    <marker id="f-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b08d57"/>
    </marker>
  </defs>

  <rect width="1060" height="640" fill="#ffffff"/>

  <text x="60" y="50" font-size="27" font-weight="600" fill="#2a2724">Modelo de ramas</text>
  <text x="60" y="76" font-size="15" fill="#6b645c">Mesto Beach System · nada se commitea directamente en una rama compartida</text>

  <!-- ══════ main ══════ -->
  <line x1="150" y1="148" x2="990" y2="148" stroke="#b08d57" stroke-width="4"/>
  <text x="60" y="143" font-size="15" font-weight="600" fill="#b08d57">main</text>
  <text x="60" y="162" font-size="12" fill="#8c857c">estable</text>
  <circle cx="185" cy="148" r="9" fill="#ffffff" stroke="#b08d57" stroke-width="4"/>
  <circle cx="645" cy="148" r="9" fill="#b08d57"/>
  <circle cx="950" cy="148" r="9" fill="#b08d57"/>
  <text x="645" y="124" font-size="12.5" font-weight="600" fill="#8a6d3f" text-anchor="middle">v1.0</text>
  <text x="950" y="124" font-size="12.5" font-weight="600" fill="#8a6d3f" text-anchor="middle">v1.1</text>

  <!-- ══════ integration ══════ -->
  <line x1="150" y1="300" x2="990" y2="300" stroke="#2f6f7f" stroke-width="4"/>
  <text x="60" y="295" font-size="15" font-weight="600" fill="#2f6f7f">integration</text>
  <text x="60" y="314" font-size="12" fill="#8c857c">día a día</text>
  <circle cx="185" cy="300" r="8" fill="#2f6f7f"/>
  <circle cx="300" cy="300" r="8" fill="#2f6f7f"/>
  <circle cx="520" cy="300" r="8" fill="#2f6f7f"/>
  <circle cx="590" cy="300" r="8" fill="#2f6f7f"/>
  <circle cx="700" cy="300" r="8" fill="#2f6f7f"/>
  <circle cx="880" cy="300" r="8" fill="#2f6f7f"/>
  <circle cx="915" cy="300" r="8" fill="#2f6f7f"/>

  <!-- integration nace de main, una sola vez -->
  <path d="M 185 157 L 185 292" fill="none" stroke="#2f6f7f" stroke-width="2.5" marker-end="url(#f-int)"/>

  <!-- ══════ ramas de trabajo ══════ -->
  <text x="60" y="470" font-size="15" font-weight="600" fill="#5c8a5c">ramas</text>
  <text x="60" y="489" font-size="12" fill="#8c857c">de trabajo</text>
  <text x="60" y="508" font-size="12" fill="#8c857c">una por cambio</text>

  <!-- rama 1 -->
  <line x1="300" y1="430" x2="520" y2="430" stroke="#5c8a5c" stroke-width="3.5"/>
  <circle cx="365" cy="430" r="7" fill="#5c8a5c"/>
  <circle cx="450" cy="430" r="7" fill="#5c8a5c"/>
  <path d="M 300 308 L 300 423" fill="none" stroke="#5c8a5c" stroke-width="2.5" marker-end="url(#f-feat)"/>
  <path d="M 520 423 L 520 308" fill="none" stroke="#5c8a5c" stroke-width="2.5" marker-end="url(#f-feat)"/>
  <text x="410" y="418" font-size="12.5" fill="#4a6b4a" text-anchor="middle">feat/pantalla-completa</text>
  <rect x="534" y="352" width="92" height="24" rx="12" fill="#eef4ee" stroke="#5c8a5c" stroke-width="1.2"/>
  <text x="580" y="369" font-size="12" font-weight="600" fill="#3f5f3f" text-anchor="middle">PR + review</text>

  <!-- rama 2 -->
  <line x1="700" y1="540" x2="880" y2="540" stroke="#5c8a5c" stroke-width="3.5"/>
  <circle cx="760" cy="540" r="7" fill="#5c8a5c"/>
  <circle cx="830" cy="540" r="7" fill="#5c8a5c"/>
  <path d="M 700 308 L 700 533" fill="none" stroke="#5c8a5c" stroke-width="2.5" marker-end="url(#f-feat)"/>
  <path d="M 880 533 L 880 308" fill="none" stroke="#5c8a5c" stroke-width="2.5" marker-end="url(#f-feat)"/>
  <text x="790" y="528" font-size="12.5" fill="#4a6b4a" text-anchor="middle">fix/qr-dinamico</text>
  <rect x="894" y="408" width="92" height="24" rx="12" fill="#eef4ee" stroke="#5c8a5c" stroke-width="1.2"/>
  <text x="940" y="425" font-size="12" font-weight="600" fill="#3f5f3f" text-anchor="middle">PR + review</text>

  <!-- ══════ versiones: integration -> main ══════ -->
  <path d="M 590 292 C 590 230, 645 220, 645 157" fill="none" stroke="#b08d57" stroke-width="3" marker-end="url(#f-main)"/>
  <rect x="551" y="212" width="132" height="25" rx="12.5" fill="#faf4ea" stroke="#b08d57" stroke-width="1.2"/>
  <text x="617" y="229" font-size="12" font-weight="600" fill="#7a6033" text-anchor="middle">PR de versión</text>

  <path d="M 915 292 C 915 230, 950 220, 950 157" fill="none" stroke="#b08d57" stroke-width="3" marker-end="url(#f-main)"/>
  <rect x="866" y="212" width="132" height="25" rx="12.5" fill="#faf4ea" stroke="#b08d57" stroke-width="1.2"/>
  <text x="932" y="229" font-size="12" font-weight="600" fill="#7a6033" text-anchor="middle">PR de versión</text>

  <!-- ══════ reglas ══════ -->
  <line x1="60" y1="574" x2="1000" y2="574" stroke="#e4ded6" stroke-width="1.5"/>

  <circle cx="70" cy="602" r="4.5" fill="#5c8a5c"/>
  <text x="86" y="607" font-size="13.5" fill="#3f3b36"><tspan font-weight="600">Sales de integration</tspan>, nunca de main.</text>

  <circle cx="376" cy="602" r="4.5" fill="#2f6f7f"/>
  <text x="392" y="607" font-size="13.5" fill="#3f3b36"><tspan font-weight="600">Todo entra por PR</tspan> a integration.</text>

  <circle cx="688" cy="602" r="4.5" fill="#b08d57"/>
  <text x="704" y="607" font-size="13.5" fill="#3f3b36"><tspan font-weight="600">main solo</tspan> desde integration.</text>

  <text x="86" y="629" font-size="13" fill="#6b645c">Cada PR actualiza <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#3f3b36">CHANGELOG.md</tspan>: qué cambió, por qué y qué se decidió.</text>
</svg>
